<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="icons/icon-48.png" alt="" width="28" height="28" />
      <span>Recipe Catcher</span>
    </div>
    <button id="catch" class="primary">Catch this recipe</button>
    <p id="status" class="status"></p>

    <div class="pref">
      <label for="units">Default units</label>
      <select id="units">
        <option value="auto">Match the page</option>
        <option value="metric">Metric</option>
        <option value="imperial">Imperial</option>
      </select>
    </div>
    <div class="pref">
      <label for="prompt">Suggest on recipe pages</label>
      <input type="checkbox" id="prompt" class="toggle" />
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
